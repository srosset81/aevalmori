name: Sync Tolgee translations

on:
  schedule:
    # Every hour, on the hour
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull-translations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull translations from Tolgee
        env:
          TOLGEE_API_KEY: ${{ secrets.TOLGEE_API_KEY }}
        run: |
          npx --yes @tolgee/cli@^2.20.0 pull \
            --path locale/_pulled \
            --file-structure-template "{languageTag}.json" \
            --delimiter "" \
            --empty-dir
          mv locale/_pulled/fr-FR.json locale/fr/messages.json
          mv locale/_pulled/it-IT.json locale/it/messages.json
          rmdir locale/_pulled

      - name: Validate translation files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('locale/fr/messages.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('locale/it/messages.json', 'utf8'))"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- locale/fr/messages.json locale/it/messages.json; then
            echo "No translation changes, nothing to commit."
          else
            git add locale/fr/messages.json locale/it/messages.json
            git commit -m "chore: sync translations from Tolgee"
            git push
          fi
