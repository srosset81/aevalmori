name: Sync Tolgee translations

on:
  schedule:
    # Every hour, on the hour
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  pull-translations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Pull translations from Tolgee
        env:
          TOLGEE_API_KEY: ${{ secrets.TOLGEE_API_KEY }}
        run: yarn tolgee:pull

      - name: Validate translation files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('locale/fr/messages.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('locale/it/messages.json', 'utf8'))"

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: sync translations from Tolgee'
          title: 'Mise à jour des traductions (Tolgee)'
          body: |
            Traductions mises à jour automatiquement depuis Tolgee (`fr` / `it`).
          branch: tolgee-sync
          delete-branch: true
          labels: translations

      - name: Auto-merge
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash --delete-branch "${{ steps.cpr.outputs.pull-request-number }}"
